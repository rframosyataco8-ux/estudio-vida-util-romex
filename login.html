<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Romex QC</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#5b6cff 0%,#7b8cff 40%,#a8b4ff 100%);padding:20px}
.card{display:flex;width:100%;max-width:920px;background:#fff;border-radius:20px;overflow:hidden;
box-shadow:0 25px 60px rgba(40,50,120,.25);min-height:520px}
.left{flex:1;padding:48px 40px;background:#eef1ff;display:flex;flex-direction:column;justify-content:center}
.brand{font-size:14px;font-weight:700;color:#3d4db8;margin-bottom:32px;letter-spacing:.5px}
.left h1{font-size:36px;font-weight:700;color:#1a237e;margin-bottom:8px;letter-spacing:1px}
.left p{font-size:14px;color:#5c6bc0;margin-bottom:28px}
label{display:block;font-size:12px;font-weight:500;color:#3949ab;margin-bottom:6px;margin-top:16px}
input[type=text],input[type=password]{width:100%;border:none;border-bottom:2px solid #c5cae9;background:transparent;
padding:10px 0;font-size:15px;outline:none;font-family:inherit;color:#1a237e;transition:.2s}
input:focus{border-bottom-color:#3d4db8}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:13px;color:#5c6bc0}
.row label{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;font-weight:400}
.row a{color:#3d4db8;text-decoration:none;font-weight:500}
.row a:hover{text-decoration:underline}
button{width:100%;margin-top:28px;padding:14px;border:none;border-radius:10px;background:linear-gradient(90deg,#5b6cff,#7b8cff);
color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(91,108,255,.4)}
button:disabled{opacity:.6;cursor:wait;transform:none}
.err{margin-top:14px;font-size:13px;color:#c62828;min-height:18px}
.right{flex:1.1;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px;position:relative}
.illus{width:100%;max-width:340px;text-align:center}
.illus-icon{width:120px;height:120px;margin:0 auto 20px;border-radius:28px;background:linear-gradient(145deg,#5b6cff,#a8b4ff);
display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 12px 32px rgba(91,108,255,.35)}
.illus h2{font-size:20px;color:#1a237e;margin-bottom:8px}
.illus p{font-size:13px;color:#7986cb;line-height:1.5}
.hint{margin-top:24px;font-size:12px;color:#9fa8da;text-align:center}
@media(max-width:720px){.card{flex-direction:column}.right{display:none}.left{padding:36px 28px}}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="brand">EXPORTADORA ROMEX S.A.</div>
    <h1>WELCOME</h1>
    <p>Control de Calidad · Planta Cacao Chincha</p>
    <form id="form" autocomplete="on">
      <label>Usuario</label>
      <input type="text" id="user" placeholder="Usuario" required autofocus>
      <label>Contraseña</label>
      <input type="password" id="pass" placeholder="••••••••" required>
      <div class="row">
        <label><input type="checkbox" id="remember"> Recordarme</label>
      </div>
      <button type="submit" id="btn">INGRESAR</button>
      <div class="err" id="err"></div>
    </form>
    <div class="hint">Usuario demo: <strong>nereyda</strong> / <strong>romex2026</strong></div>
  </div>
  <div class="right">
    <div class="illus">
      <div class="illus-icon">🔒</div>
      <h2>Acceso seguro</h2>
      <p>Microbiología y Físicoquímico sincronizados con SQL Server. Solo personal autorizado.</p>
    </div>
  </div>
</div>
<script>
(function(){
  if (localStorage.getItem('romex_token')) {
    location.href = 'index.html';
    return;
  }
  var API = (location.port === '5500' || location.port === '5501') ? 'http://localhost:3000' : '';
  document.getElementById('form').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('btn');
    var err = document.getElementById('err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'VERIFICANDO…';
    try {
      var r = await fetch(API + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user: document.getElementById('user').value.trim(),
          pass: document.getElementById('pass').value
        })
      });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Credenciales incorrectas');
      localStorage.setItem('romex_token', data.token);
      localStorage.setItem('romex_user', data.nombre || data.user);
      location.href = 'index.html';
    } catch (ex) {
      err.textContent = ex.message || 'No se pudo conectar al servidor';
      btn.disabled = false;
      btn.textContent = 'INGRESAR';
    }
  });
})();
</script>
</body>
</html>
