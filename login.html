<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenido · Romex</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:rgb(184,184,211);padding:24px}
.shell{width:100%;max-width:990px;background:#fff;border-radius:12px;box-shadow:0 24px 58px rgba(50,60,140,.25);overflow:hidden;display:flex;min-height:660px}
.left{width:46%;min-width:300px;background:#fff;padding:34px 0 40px 36px;display:flex;flex-direction:column}
.brand{font-size:17px;font-weight:700;color:#2c3e8c;margin:0 0 20px 35px}
.panel{flex:1;background:#E8ECF8;border-radius:16px;padding:38px 56px 36px;display:flex;flex-direction:column;justify-content:center}
.panel h1{font-size:30px;font-weight:700;color:#1e2a6e;letter-spacing:2px;text-align:center;margin-bottom:34px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:#5a6a9a;margin-bottom:4px}
.field input{width:100%;border:none;border-bottom:2px solid #40549b;background:transparent;padding:6px 0 7px;font-size:13px;font-family:inherit;color:#1e2a6e;outline:none}
.field input:focus{border-bottom-color:#5b6cff}
.field input.invalid{border-bottom-color:#c62828}
.field .hint{font-size:11px;color:#c62828;margin-top:4px;min-height:14px}
.row{display:flex;align-items:center;justify-content:space-between;margin:7px 0 25px;font-size:11px;color:#2c448f}
.row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.btn{width:100%;border:none;border-radius:0;padding:15px;background:#7182f6;color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{background:#6f82f5;box-shadow:0 8px 20px rgba(91,108,255,.35)}
.btn:disabled{opacity:.65;cursor:wait}
.err{margin-top:12px;font-size:12px;color:#c62828;text-align:center;min-height:16px}
.right{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:44px 32px 28px}
.login-illustration{display:block;width:100%;max-width:500px;height:auto;object-fit:contain}
@media(max-width:800px){body{padding:14px}.shell{flex-direction:column;max-width:440px;min-height:0}.left{width:100%;padding:28px 24px 24px}.brand{margin-left:4px}.panel{padding:38px 34px 34px;min-height:470px}.right{display:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="left">
    <div class="brand">Exportadora RomEx S.A.</div>
    <div class="panel">
      <h1>BIENVENIDO</h1>
      <form id="form" novalidate>
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="user" placeholder="usuario" required autofocus autocomplete="username" maxlength="50">
          <div class="hint" id="userHint"></div>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="pass" placeholder="••••••••" required autocomplete="current-password" maxlength="128">
          <div class="hint" id="passHint"></div>
        </div>
        <div class="row">
          <label><input type="checkbox" id="remember"> Recordarme</label>
        </div>
        <button type="submit" class="btn" id="btn">INGRESAR</button>
        <div class="err" id="err"></div>
      </form>
    </div>
  </div>
  <div class="right">
    <img class="login-illustration" src="img/Gemini_Generated_Image_8gkfoz8gkfoz8gkf.jpg" alt="Ilustración login">
  </div>
</div>
<script>
(function () {
  if (localStorage.getItem('romex_token') || sessionStorage.getItem('romex_token')) {
    location.href = 'index.html';
    return;
  }

  function resolveApiBase() {
    var host = location.hostname;
    var port = location.port;
    var proto = location.protocol;
    if (proto === 'file:' || port === '5500' || port === '5501' || port === '8080' || port === '5173') {
      return 'http://localhost:3000';
    }
    if (host === 'localhost' || host === '127.0.0.1') {
      if (port && port !== '3000') return 'http://localhost:3000';
    }
    return '';
  }

  var API = resolveApiBase();

  function validateLogin() {
    var u = document.getElementById('user');
    var p = document.getElementById('pass');
    var uh = document.getElementById('userHint');
    var ph = document.getElementById('passHint');
    var ok = true;
    uh.textContent = '';
    ph.textContent = '';
    u.classList.remove('invalid');
    p.classList.remove('invalid');

    var user = u.value.trim();
    var pass = p.value;

    if (!user) {
      uh.textContent = 'Ingresa tu usuario';
      u.classList.add('invalid');
      ok = false;
    } else if (user.length < 3) {
      uh.textContent = 'Mínimo 3 caracteres';
      u.classList.add('invalid');
      ok = false;
    }

    if (!pass) {
      ph.textContent = 'Ingresa tu contraseña';
      p.classList.add('invalid');
      ok = false;
    } else if (pass.length < 4) {
      ph.textContent = 'Mínimo 4 caracteres';
      p.classList.add('invalid');
      ok = false;
    }

    return ok;
  }

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var err = document.getElementById('err');
    err.textContent = '';
    if (!validateLogin()) return;

    var btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = 'INGRESANDO…';
    try {
      var r = await fetch(API + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user: document.getElementById('user').value.trim(),
          pass: document.getElementById('pass').value
        })
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(data.error || 'Credenciales inválidas');

      // Limpiar ambos storages y guardar solo donde corresponde
      localStorage.removeItem('romex_token');
      localStorage.removeItem('romex_user');
      localStorage.removeItem('romex_rol');
      sessionStorage.removeItem('romex_token');
      sessionStorage.removeItem('romex_user');
      sessionStorage.removeItem('romex_rol');

      var store = document.getElementById('remember').checked ? localStorage : sessionStorage;
      store.setItem('romex_token', data.token);
      store.setItem('romex_user', data.nombre || data.user);
      store.setItem('romex_rol', data.rol || 'LECTOR');

      location.href = 'index.html';
    } catch (ex) {
      err.textContent = ex.message || 'Error de conexión';
      btn.disabled = false;
      btn.textContent = 'INGRESAR';
    }
  });
})();
</script>
</body>
</html>
