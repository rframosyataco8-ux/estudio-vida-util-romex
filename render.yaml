# Blueprint Render — Romex QC (vida útil)
# Dashboard: New → Blueprint → conectar este repo
services:
  - type: web
    name: romex-qc
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server
    startCommand: node server/run.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: romex-qc-db
          property: connectionString

databases:
  - name: romex-qc-db
    plan: free
    databaseName: romexqc
    user: romex
