<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Calidad · Exportadora Romex S.A.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">ROMEX</div>
      <div class="brand-sub">Control de Calidad</div>
    </div>
    <div class="sidebar-section">Productos</div>
    <nav id="productNav"></nav>
    <div class="sidebar-footer">
      <div class="analyst">Nereyda Huachua Flores</div>
      <div class="plant">Planta Cacao Chincha</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="productTitle">—</h1>
        <span class="lote-badge" id="loteBadge">—</span>
      </div>
      <div class="topbar-right">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="micro">Microbiología</button>
          <button class="mode-btn" data-mode="fisico">Físicoquímico</button>
        </div>
        <button class="icon-btn" onclick="window.print()" title="Imprimir">&#128424;</button>
        <button class="icon-btn" onclick="saveData()" title="Guardar">&#128190;</button>
      </div>
    </header>

    <div class="month-tabs" id="monthTabs"></div>
    <div class="content" id="content"></div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
