<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<title>Control de Calidad · Romex</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dark.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
(function () {
  var t = localStorage.getItem('romex_token') || sessionStorage.getItem('romex_token');
  if (!t) location.replace('login.html');
  var th = localStorage.getItem('romex_theme');
  if (th === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<style>
  html.romex-boot #splash { visibility: hidden; }
  html.romex-ready #splash { visibility: visible; }
  .year-select {
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 6px 10px; border: 1.5px solid var(--md-outline, #d0d7de);
    border-radius: 10px; background: var(--md-surface-1, #fff); color: var(--md-text, #1a2332);
    outline: none; cursor: pointer;
  }
  .empty-state {
    grid-column: 1 / -1; text-align: center; padding: 48px 24px;
    color: var(--md-text-sec, #5a6a7a);
  }
  .empty-state .material-icons-outlined { font-size: 48px; opacity: .4; margin-bottom: 12px; }
  .empty-state strong { display: block; font-size: 15px; color: var(--md-text, #1a2332); margin-bottom: 8px; }
  .badge.warn { background: #fff3e0; color: #e65100; }
  .badge.danger { background: #ffebee; color: #c62828; }
</style>
<script>document.documentElement.classList.add('romex-boot');</script>
</head>
<body>
  <div id="splash">
    <div class="splash-mesh" aria-hidden="true">
      <span class="mesh m1"></span><span class="mesh m2"></span>
      <span class="mesh m3"></span><span class="mesh m4"></span>
    </div>
    <div class="splash-card">
      <div class="splash-mark">
        <svg class="splash-arc" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="arc-bg" cx="50" cy="50" r="44"/>
          <circle class="arc-fg" cx="50" cy="50" r="44"/>
        </svg>
        <div class="splash-icon"><span class="material-icons-outlined">science</span></div>
      </div>
      <div class="splash-brand">
        <span class="splash-brand-line"></span>
        <h1 class="splash-title">Exportadora RomEx S.A.</h1>
        <span class="splash-brand-line"></span>
      </div>
      <p class="splash-sub">Control de Calidad · Planta Chincha</p>
      <div class="splash-progress"><div class="splash-progress-bar"></div></div>
      <p class="splash-status">Inicializando…</p>
    </div>
  </div>

  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="material-icons-outlined">science</span>
      <div>
        <div class="drawer-title">Romex QC</div>
        <div class="drawer-sub">Control de Calidad · v1.3</div>
      </div>
    </div>
    <div class="drawer-body">
      <button type="button" class="nav-group-btn" id="productsToggle" aria-expanded="false">
        <span class="nav-group-left">
          <span class="material-icons-outlined nav-group-icon">inventory_2</span>
          <span>Productos</span>
        </span>
        <span class="material-icons-outlined nav-group-chevron">expand_more</span>
      </button>
      <nav id="productNav" class="drawer-nav"></nav>
      <div class="drawer-actions admin-only" id="drawerActions" hidden>
        <button type="button" class="drawer-action-btn" id="addProductBtn">
          <span class="material-icons-outlined">add_box</span> Nuevo producto
        </button>
        <button type="button" class="drawer-action-btn" id="auditBtn" style="margin-top:6px">
          <span class="material-icons-outlined">history</span> Auditoría
        </button>
      </div>
    </div>
    <div class="drawer-footer">
      <div class="footer-name" id="userName">—</div>
      <div class="footer-role" id="userRoleLabel">—</div>
      <div class="db-status" id="dbStatus"><span class="dot"></span> Base de datos</div>
      <button type="button" class="logout-btn" id="logoutBtn">
        <span class="material-icons-outlined" style="font-size:16px">logout</span>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="app" id="app">
    <header class="app-bar">
      <button class="icon-btn" id="menuBtn" title="Menú" type="button">
        <span class="material-icons-outlined">menu</span>
      </button>
      <h1 id="productTitle">—</h1>
      <span class="chip" id="loteBadge">—</span>
      <select class="year-select" id="yearSelect" title="Año">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
      </select>
      <div class="spacer"></div>
      <span class="save-indicator" id="saveInd"></span>
      <div class="segmented">
        <button type="button" class="seg active" data-mode="micro">Microbiología</button>
        <button type="button" class="seg" data-mode="fisico">Físicoquímico</button>
      </div>
      <button type="button" class="icon-btn" id="exportBtn" title="Exportar CSV (Excel)">
        <span class="material-icons-outlined">download</span>
      </button>
      <button type="button" class="icon-btn" id="compareBtn" title="Comparar productos">
        <span class="material-icons-outlined">compare_arrows</span>
      </button>
      <button type="button" class="icon-btn admin-only" id="addMonthBtn" title="Agregar mes" hidden>
        <span class="material-icons-outlined">add_circle_outline</span>
      </button>
      <button type="button" class="icon-btn" id="themeBtn" title="Tema claro/oscuro">
        <span class="material-icons-outlined">dark_mode</span>
      </button>
      <button type="button" class="icon-btn" onclick="window.print()" title="Imprimir / PDF">
        <span class="material-icons-outlined">print</span>
      </button>
    </header>

    <div class="tabs" id="monthTabs"></div>
    <main class="content" id="content">
      <div class="loading"><div class="spinner"></div> Conectando…</div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalMes" hidden>
    <div class="modal" role="dialog">
      <div class="modal-head">
        <h2>Agregar mes</h2>
        <button type="button" class="modal-close" data-close="modalMes">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row"><label>Año</label><input type="number" id="mesAnio" value="2026" min="2020" max="2099"></div>
        <div class="form-row"><label>Mes</label>
          <select id="mesNumero">
            <option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option>
            <option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option>
            <option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option>
            <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
          </select>
        </div>
        <div class="form-row"><label>Fecha análisis</label><input type="date" id="mesFecha"></div>
        <h3 class="modal-section">Microbiología (ufc/gr)</h3>
        <div class="form-grid">
          <label>RTAMV <input type="number" id="m_rtamv" value="0" min="0"></label>
          <label>Mohos <input type="number" id="m_mohos" value="0" min="0"></label>
          <label>Coliformes <input type="number" id="m_coliformes" value="0" min="0"></label>
          <label>E.Coli <input type="number" id="m_ecoli" value="0" min="0"></label>
          <label>Enterob. <input type="number" id="m_enterobacterias" value="0" min="0"></label>
          <label>Levaduras <input type="number" id="m_levaduras" value="0" min="0"></label>
          <label>S.Aureus <input type="number" id="m_saureus" value="0" min="0"></label>
        </div>
        <h3 class="modal-section">Físicoquímico</h3>
        <div class="form-grid">
          <label>% Humedad <input type="number" step="0.01" id="f_humedad" value="0"></label>
          <label>pH <input type="number" step="0.01" id="f_ph" value="0"></label>
          <label>% Ceniza <input type="number" step="0.01" id="f_ceniza" value="0"></label>
          <label>% Grasa <input type="number" step="0.01" id="f_grasa" value="0"></label>
          <label>% Fineza <input type="number" step="0.01" id="f_fineza" value=""></label>
          <label>% Acidez <input type="number" step="0.01" id="f_acidez" value=""></label>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close="modalMes">Cancelar</button>
        <button type="button" class="btn-primary" id="saveMesBtn">Guardar mes</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalProducto" hidden>
    <div class="modal modal-sm" role="dialog">
      <div class="modal-head">
        <h2>Nuevo producto</h2>
        <button type="button" class="modal-close" data-close="modalProducto">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row"><label>Nombre del producto</label><input type="text" id="prodNombre" required></div>
        <div class="form-row"><label>Lote</label><input type="text" id="prodLote" required></div>
        <div class="form-row"><label>Código (opcional)</label><input type="text" id="prodCodigo"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close="modalProducto">Cancelar</button>
        <button type="button" class="btn-primary" id="saveProdBtn">Crear producto</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalCompare" hidden>
    <div class="modal" role="dialog">
      <div class="modal-head">
        <h2>Comparar productos</h2>
        <button type="button" class="modal-close" data-close="modalCompare">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row"><label>Producto A</label><select id="cmpA"></select></div>
        <div class="form-row"><label>Producto B</label><select id="cmpB"></select></div>
        <div id="cmpResult" style="margin-top:12px;font-size:13px"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close="modalCompare">Cerrar</button>
        <button type="button" class="btn-primary" id="runCompareBtn">Comparar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalAudit" hidden>
    <div class="modal" role="dialog" style="max-width:720px">
      <div class="modal-head">
        <h2>Historial de auditoría</h2>
        <button type="button" class="modal-close" data-close="modalAudit">&times;</button>
      </div>
      <div class="modal-body" id="auditList">—</div>
      <div class="modal-foot">
        <button type="button" class="btn-ghost" data-close="modalAudit">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="snackbar" id="snackbar"></div>
  <script>
    (function () {
      var host = location.hostname, port = location.port, proto = location.protocol;
      if (proto === 'file:' || port === '5500' || port === '5501' || port === '8080' || port === '5173') {
        window.API_BASE = 'http://localhost:3000';
      } else if ((host === 'localhost' || host === '127.0.0.1') && port && port !== '3000') {
        window.API_BASE = 'http://localhost:3000';
      } else {
        window.API_BASE = '';
      }
    })();
  </script>
  <script src="js/app.js"></script>
  <script src="js/extras.js"></script>
</body>
</html>
