<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Calidad · Romex</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script>
if (!localStorage.getItem('romex_token')) location.replace('login.html');
</script>
</head>
<body>
  <div id="splash">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-inner">
      <div class="splash-logo-wrap">
        <div class="splash-logo-pulse"></div>
        <div class="splash-logo">
          <span class="material-icons-outlined">science</span>
        </div>
      </div>
      <div class="splash-title">Exportadora RomEx S.A.</div>
      <div class="splash-sub">Control de Calidad · Planta Chincha</div>
      <div class="splash-loader">
        <div class="splash-loader-track">
          <div class="splash-loader-fill"></div>
        </div>
        <div class="splash-loader-text">Cargando sistema…</div>
      </div>
    </div>
  </div>

  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="material-icons-outlined">science</span>
      <div>
        <div class="drawer-title">Romex QC</div>
        <div class="drawer-sub">Control de Calidad</div>
      </div>
    </div>

    <div class="drawer-body">
      <button type="button" class="nav-group-btn" id="productsToggle" aria-expanded="false">
        <span class="nav-group-left">
          <span class="material-icons-outlined nav-group-icon">inventory_2</span>
          <span>Productos</span>
        </span>
        <span class="material-icons-outlined nav-group-chevron">expand_more</span>
      </button>
      <nav id="productNav" class="drawer-nav"></nav>
    </div>

    <div class="drawer-footer">
      <div class="footer-name" id="userName">—</div>
      <div class="footer-role">Analista · Planta Chincha</div>
      <div class="db-status" id="dbStatus"><span class="dot"></span> SQL Server</div>
      <button type="button" class="logout-btn" id="logoutBtn">
        <span class="material-icons-outlined" style="font-size:16px;vertical-align:-3px">logout</span>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="app">
    <header class="app-bar">
      <button class="icon-btn" id="menuBtn" title="Menú"><span class="material-icons-outlined">menu</span></button>
      <h1 id="productTitle">—</h1>
      <span class="chip" id="loteBadge">—</span>
      <div class="spacer"></div>
      <span class="save-indicator" id="saveInd"></span>
      <div class="segmented">
        <button class="seg active" data-mode="micro">Microbiología</button>
        <button class="seg" data-mode="fisico">Físicoquímico</button>
      </div>
      <button class="icon-btn" id="addMonthBtn" title="Agregar mes"><span class="material-icons-outlined">add_circle_outline</span></button>
      <button class="icon-btn" onclick="window.print()" title="Imprimir"><span class="material-icons-outlined">print</span></button>
    </header>

    <div class="tabs" id="monthTabs"></div>
    <main class="content" id="content">
      <div class="loading"><div class="spinner"></div> Conectando a SQL Server…</div>
    </main>
  </div>

  <div class="snackbar" id="snackbar"></div>
  <script>
    (function () {
      var p = window.location.port;
      if (p === '5500' || p === '5501' || p === '8080' || location.protocol === 'file:') {
        window.API_BASE = 'http://localhost:3000';
      } else {
        window.API_BASE = '';
      }
    })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
